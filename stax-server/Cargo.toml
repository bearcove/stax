[package]
name = "stax-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Unprivileged long-running daemon: hosts the run registry, the live aggregator, the web UI, and the agent-facing RunControl service."

[dependencies]
stax-live-proto = { path = "../stax-live-proto" }
stax-live = { path = "../stax-live" }
stax-vox-observe = { version = "0.1", path = "../stax-vox-observe" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
parking_lot = "0.12"
async-trait = "0.1"
facet-json = "0.50.0-rc.0"

eyre = "0.6"
libc = "0.2"

stax-core = { path = "..", default-features = false }

vox = { version = "0.10.0-rc.0", features = ["transport-websocket"] }

[target.'cfg(target_os = "macos")'.dependencies]
stax-mac-shared-cache = { version = "0.1", path = "../stax-mac-shared-cache" }
stax-mac-capture = { version = "0.1", path = "../stax-mac-capture" }
staxd-client = { path = "../staxd-client" }
tracing-oslog = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
stax-linux-capture = { version = "0.1", path = "../stax-linux-capture" }
staxd-proto = { version = "0.1", path = "../staxd-proto" }

[[bin]]
name = "stax-server"
path = "src/main.rs"
