# esbuild's postinstall fetches its platform binary, which vite's
# bundler requires. pnpm 11 gates build scripts behind this allowlist.
allowBuilds:
  esbuild: true
overrides:
  '@bearcove/phon-engine': link:/Users/amos/phon/typescript/packages/phon-engine
  '@bearcove/phon-schema': link:/Users/amos/phon/typescript/packages/phon-schema
  '@bearcove/vox-core': link:/Users/amos/vox/typescript/packages/vox-core
  '@bearcove/vox-tcp': link:/Users/amos/vox/typescript/packages/vox-tcp
  '@bearcove/vox-wire': link:/Users/amos/vox/typescript/packages/vox-wire
  '@bearcove/vox-ws': link:/Users/amos/vox/typescript/packages/vox-ws
minimumReleaseAgeExclude:
  - '@bearcove/phon-engine@0.2.0-rc.0'
  - '@bearcove/phon-schema@0.2.0-rc.0'
  - '@bearcove/vox-core@0.9.0-rc.0'
  - '@bearcove/vox-tcp@0.9.0-rc.0'
  - '@bearcove/vox-wire@0.9.0-rc.0'
  - '@bearcove/vox-ws@0.9.0-rc.0'
