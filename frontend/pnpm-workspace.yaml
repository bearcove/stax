# esbuild's postinstall fetches its platform binary, which vite's
# bundler requires. pnpm 11 gates build scripts behind this allowlist.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@bearcove/vox-core@0.5.1'
  - '@bearcove/vox-postcard@0.5.1'
  - '@bearcove/vox-tcp@0.5.1'
  - '@bearcove/vox-wire@0.5.1'
  - '@bearcove/vox-ws@0.5.1'
