[package]
name = "stax-target"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Target-side latch for stax: report execution-lane spans (GPU kernels, accelerators, executors) into a live stax recording."

[dependencies]
libc = "0.2"
stax-live-proto = { path = "../stax-live-proto" }
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
vox = "0.9.0-rc.0"
